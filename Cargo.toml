[package]
name = "durable-workflow"
version = "2.0.0"
edition = "2021"
description = "Rust client and worker SDK for Durable Workflow Cloud and self-hosted Server"
license = "MIT"
repository = "https://github.com/durable-workflow/sdk-rust"
homepage = "https://rust.durable-workflow.com/"
documentation = "https://rust.durable-workflow.com/"
readme = "README.md"
rust-version = "1.86"
keywords = ["durable", "workflow", "temporal", "worker", "sdk"]
categories = ["api-bindings", "asynchronous"]
include = ["/src/**", "/schema/**", "/examples/**", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[package.metadata.durable-workflow]
product-train = "2.0.0"
compatibility-authority = "protocol-manifests"
supported-server-versions = "2.0.0"
qualified-server-version = "2.0.0"
worker-protocol-version = "1.19"
server-worker-protocol-versions = ">=1.19,<2.0"
portable-worker-affinity-minimum-worker-protocol-version = "1.18"
local-activities = false
worker-sessions = false
sticky-execution = false
control-plane-version = "2"
message-streams = true
message-streams-minimum-worker-protocol-version = "1.15"
query-tasks = true
query-task-minimum-worker-protocol-version = "1.8"
replayed-instance-state-queries = true
query-state-model = "deterministic-workflow-replay"
snapshot-inspection-queries = true
child-workflows = true
child-workflow-command = "start_child_workflow"
child-workflow-failure-reasons = ["child_workflow", "cancelled", "terminated"]
activity-options = true
activity-retry-policy = true
activity-timeouts = ["start_to_close", "schedule_to_start", "schedule_to_close", "heartbeat"]
activity-failure-reasons = ["activity", "cancelled", "timeout"]
workflow-lifecycle-commands = ["cancel", "terminate"]
workflow-lifecycle-run-targeting = "current-run-guard"
workflow-terminal-outcomes = ["failed", "cancelled", "terminated", "timed_out"]
workflow-start-timeouts = ["execution_timeout_seconds", "run_timeout_seconds"]
payload-codecs = ["avro"]
durable-timers = true
timer-command = "start_timer"
timer-replay-validation = "command-order+sequence+timer-id+delay"
durable-condition-waits = true
condition-wait-command = "open_condition_wait"
condition-wait-minimum-worker-protocol-version = "1.9"
condition-wait-result = ["satisfied", "timed_out"]
condition-wait-occurrence-capability = "condition_wait_occurrence_identity"
condition-wait-occurrence-identity = "explicit-deterministic-authored-ordinal"
condition-wait-occurrence-minimum-worker-protocol-version = "1.17"
condition-wait-replay-validation = "command-order+authored-occurrence+sequence+key+predicate-fingerprint+timeout"
workflow-search-attribute-updates = true
search-attribute-update-command = "upsert_search_attributes"
search-attribute-update-minimum-worker-protocol-version = "1.8"
search-attribute-types = ["string", "keyword", "keyword_list", "int", "float", "bool", "datetime"]
deterministic-side-effects = true
side-effect-command = "record_side_effect"
side-effect-history-event = "SideEffectRecorded"
version-markers = true
version-marker-command = "record_version_marker"
version-marker-history-event = "VersionMarkerRecorded"
version-marker-helpers = ["patched", "deprecate_patch"]
continue-as-new = true
continue-as-new-command = "continue_as_new"
continue-as-new-routing-overrides = ["workflow_type", "queue"]
workflow-history-budget = ["total_history_events", "history_size_bytes", "continue_as_new_recommended", "history_budget_pressure"]
workflow-result-routing = "current-run-chain-with-selected-run-view"
workflow-streams-contract = "durable-workflow.v2.workflow-streams.contract@1"
workflow-streams-operations = ["list", "describe", "subscribe", "append", "close", "error"]
workflow-streams-authoring-command = "record_side_effect.workflow_stream"
workflow-streams-delivery = "at-least-once"
workflow-streams-external-payload-references = "opaque-reference"
typed-search-attributes = true
typed-search-attributes-minimum-worker-protocol-version = "1.16"
search-attribute-replay-identity = "json-value+canonical-declared-type"
legacy-search-attribute-history = "value-only+unknown-type-identity"
deterministic-parallel = true
parallel-authoring = "parallel+join"
durable-selection = true
durable-selection-authoring = "select+select_keyed"
durable-selection-minimum-worker-protocol-version = "1.19"
durable-selection-winner-history-event = "SelectionResolved"
durable-selection-non-winner-lifecycle = ["continue", "await", "cancel"]
parallel-members = ["activity", "child", "timer", "mixed", "nested"]
parallel-result-order = "input-position"
parallel-group-metadata = ["parallel_group_id", "parallel_group_kind", "parallel_group_base_sequence", "parallel_group_size", "parallel_group_index", "parallel_group_path"]
saga-compensation = true
saga-compensation-order = "reverse-registration-sequential"
saga-compensation-failure-policy = "stop-first-preserve-initiating-and-compensation"
saga-cancellation = "cooperative"

[package.metadata.durable-workflow.documentation]
path-order = ["general", "cloud"]
availability = { general = "generally-available", cloud = "limited-early-access" }
general-destinations = ["crate-install", "local-self-hosted", "api-reference", "sdk-guide"]
cloud-destinations = ["cloud-access", "cloud-guide"]

[lib]
name = "durable_workflow"
path = "src/lib.rs"

[dependencies]
apache-avro = { version = "0.21", default-features = false }
base64 = "0.22"
# Keep apache-avro's dependency resolution compatible with the Rust 1.86 MSRV.
bon = { version = "=3.8.1", default-features = false }
chrono = { version = "0.4", default-features = false }
futures-util = "0.3"
# Keep reqwest's IDNA dependency resolution compatible with the Rust 1.86 MSRV.
icu_collections = { version = "=2.2.0", default-features = false }
icu_locale_core = { version = "=2.2.0", default-features = false }
icu_normalizer = { version = "=2.2.0", default-features = false }
icu_properties = { version = "=2.2.0", default-features = false }
icu_provider = { version = "=2.2.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-value = "0.7"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
serde_bytes = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
