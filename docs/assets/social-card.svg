<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Durable Workflow Rust SDK</title>
  <desc id="description">Durable workflows in Rust. Author workflows and activities, and run workers with the first-party SDK.</desc>
  <style>
    @font-face { font-family: Inter; font-weight: 400 600; src: url('fonts/inter-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Space Grotesk'; font-weight: 600; src: url('fonts/space-grotesk-latin.woff2') format('woff2'); }
    @font-face { font-family: 'JetBrains Mono'; font-weight: 400 600; src: url('fonts/jetbrains-mono-latin.woff2') format('woff2'); }
  </style>
  <rect width="1200" height="630" fill="#F6F7F5"/>
  <image href="logo.svg" x="72" y="58" width="64" height="64"/>
  <text x="156" y="99" fill="#0F1513" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="600">Durable Workflow</text>
  <text x="445" y="98" fill="#5E6964" font-family="Inter, sans-serif" font-size="26">/</text>
  <text x="472" y="98" fill="#0F7A52" font-family="JetBrains Mono, monospace" font-size="24">rust</text>
  <text x="72" y="249" fill="#0F1513" font-family="Space Grotesk, sans-serif" font-size="76" font-weight="600" letter-spacing="-2">Durable workflows</text>
  <text x="72" y="333" fill="#0F1513" font-family="Space Grotesk, sans-serif" font-size="76" font-weight="600" letter-spacing="-2">in Rust.</text>
  <text x="72" y="396" fill="#3B4541" font-family="Inter, sans-serif" font-size="27">Author workflows and activities. Run workers.</text>
  <rect x="72" y="450" width="600" height="64" rx="8" fill="#0F1513"/>
  <text x="94" y="491" fill="#5FE0A6" font-family="JetBrains Mono, monospace" font-size="25">$</text>
  <text x="125" y="491" fill="#E8EDEA" font-family="JetBrains Mono, monospace" font-size="25">cargo add durable-workflow</text>
  <text x="72" y="575" fill="#5E6964" font-family="JetBrains Mono, monospace" font-size="21">rust.durable-workflow.com</text>
</svg>
