[package]
name = "installed-condition-history"
version = "0.0.0"
edition = "2021"
publish = false
rust-version = "1.86"

[workspace]

[dependencies]
durable-workflow = "=4.12.0"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.dev]
debug = 0
incremental = false
