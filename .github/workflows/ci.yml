name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-corpus:
    name: Regression corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the Rust regression toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: 1.86.0
      - name: Require durable replay and codec evidence
        env:
          CORPUS_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python scripts/ci/test-validate-regression-corpus.py
          arguments=()
          if [[ "$CORPUS_BASE_REF" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$CORPUS_BASE_REF" =~ ^0+$ ]]; then
            arguments+=(--base-ref "$CORPUS_BASE_REF")
          fi
          python scripts/ci/validate-regression-corpus.py "${arguments[@]}"

  verify:
    name: Rust ${{ matrix.rust }}
    if: ${{ vars.SOURCE_QUALIFICATION_MODE == '' || vars.SOURCE_QUALIFICATION_MODE == 'complete' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.86.0', 'stable']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test all targets
        run: cargo test --all-targets

      - name: Enforce Avro Value regression budget
        if: matrix.rust == 'stable'
        run: cargo run --release --example avro_value_benchmark -- --enforce

      - name: Qualify warning-free API documentation and examples
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --all-features --no-deps
          cargo doc --all-features --no-deps --examples
          python3 scripts/ci/validate-example-base-urls.py --rendered-docs target/doc

      - name: Verify publishable package
        run: cargo package

      - name: Validate release tooling
        run: |
          bash -n scripts/ci/crates-io-publish-lib.sh scripts/ci/publish-rust-sdk.sh scripts/ci/test-crates-io-publish.sh
          python -m py_compile scripts/ci/component-release-recovery.py scripts/ci/publish-planned-tag.py scripts/ci/release_recovery_consumer_conformance.py scripts/ci/run-bounded-qualification.py scripts/ci/validate-example-base-urls.py scripts/ci/test-component-release-recovery.py scripts/ci/test-example-base-urls.py scripts/ci/test-source-qualification.py scripts/ci/test-publish-planned-tag.py scripts/ci/test-publish-rust-sdk.py
          python -m py_compile scripts/ci/test-docs-workflow.py
          scripts/ci/test-crates-io-publish.sh
          arguments=()
          if [ -n "$CONFORMANCE_BASE_REF" ]; then
            arguments+=(--previous-ref "$CONFORMANCE_BASE_REF")
          fi
          python scripts/ci/release_recovery_consumer_conformance.py \
            --contract scripts/ci/release-recovery-consumer-contract.json \
            --adapter scripts/ci/release-recovery-consumer-adapter.json \
            "${arguments[@]}"
          python scripts/ci/test-publish-planned-tag.py
          python scripts/ci/test-publish-rust-sdk.py
          python scripts/ci/test-example-base-urls.py
          python scripts/ci/test-docs-workflow.py
          python scripts/ci/test-source-qualification.py
        env:
          CONFORMANCE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  bounded-qualification:
    name: Bounded structural qualification
    if: ${{ vars.SOURCE_QUALIFICATION_MODE == 'bounded' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the structural toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: 1.86.0
          components: rustfmt

      - name: Run bounded candidate structure checks
        env:
          CANDIDATE_EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_BEFORE_SHA: ${{ github.event.before }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_CURRENT_SHA: ${{ github.sha }}
          BOUNDED_QUALIFICATION_TIMING: ${{ runner.temp }}/bounded-qualification-timing.json
        run: python3 scripts/ci/run-bounded-qualification.py

  target-branch-qualification:
    name: Target branch qualification
    if: ${{ always() }}
    needs: [regression-corpus, verify, bounded-qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require regression corpus validation
        env:
          CORPUS_RESULT: ${{ needs.regression-corpus.result }}
        run: test "$CORPUS_RESULT" = success

      - name: Require the selected source qualification route
        env:
          QUALIFICATION_MODE: ${{ vars.SOURCE_QUALIFICATION_MODE }}
          COMPLETE_RESULT: ${{ needs.verify.result }}
          BOUNDED_RESULT: ${{ needs.bounded-qualification.result }}
        run: |
          case "${QUALIFICATION_MODE:-complete}" in
            complete)
              test "$COMPLETE_RESULT" = success
              ;;
            bounded)
              test "$BOUNDED_RESULT" = success
              ;;
            *)
              printf 'unsupported source qualification mode: %s\n' "$QUALIFICATION_MODE" >&2
              exit 1
              ;;
          esac
