name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_qualification:
        description: Qualify ordinary local activities against the exact published Server image
        type: boolean
        default: false
      local_sdk_version:
        description: Optional exact crates.io SDK version instead of source qualification
        type: string
        default: ""
      cooperative_qualification:
        description: Run cooperative protocol 1.20 cases against an isolated Server candidate
        type: boolean
        default: false
      server_commit:
        description: Exact 40-character public Server candidate SHA
        type: string
        default: ""
      native_commit:
        description: Optional exact public Native candidate SHA for readonly source qualification
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  action-policy:
    name: Central action policy preflight
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Check out central action policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/.github
          ref: main
          path: .central-action-policy
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - run: python -m pip install PyYAML==6.0.2
      - name: Require centrally approved immutable action commits
        run: >-
          python .central-action-policy/scripts/qualification_policy.py validate
          --policy .central-action-policy/qualification/policy.json
          --target sdk-rust
          --workflow-directory .github/workflows

  regression-corpus:
    name: Regression corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: 1.86.0
      - name: Require durable replay and codec fixtures
        env:
          CORPUS_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          arguments=()
          if [[ "$CORPUS_BASE_REF" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$CORPUS_BASE_REF" =~ ^0+$ ]]; then
            arguments+=(--base-ref "$CORPUS_BASE_REF")
          fi
          python scripts/ci/validate-regression-corpus.py "${arguments[@]}"
      - name: Test the corpus policy
        run: python scripts/ci/test-validate-regression-corpus.py

  test:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.86.0', 'stable']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --all-targets --all-features

  protocol:
    name: Avro protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: 1.86.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Require the official Apache Avro encoder
        run: |
          python3 scripts/ci/verify-official-avro-encoder.py
          python3 scripts/ci/test-official-avro-encoder.py
      - name: Verify Rust payloads with the official PHP and Python Avro bindings
        run: |
          python3 -m venv "${RUNNER_TEMP}/official-avro-python"
          "${RUNNER_TEMP}/official-avro-python/bin/pip" install --requirement scripts/ci/official-avro-consumers/requirements.txt
          composer install --working-dir=scripts/ci/official-avro-consumers --no-interaction --no-progress --prefer-dist
          OFFICIAL_AVRO_PYTHON="${RUNNER_TEMP}/official-avro-python/bin/python" scripts/ci/qualify-cross-language-avro-consumers.sh
      - name: Enforce the Avro Value regression budget
        run: cargo run --release --example avro_value_benchmark -- --enforce

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: 1.86.0
      - name: Build and check the documentation
        env:
          RUSTDOCFLAGS: -D warnings --html-in-header docs/analytics-head.html
        run: |
          cargo doc --all-features --no-deps
          cargo doc --all-features --no-deps --examples
          printf '%s\n' 'rust.durable-workflow.com' > target/doc/CNAME
          touch target/doc/.nojekyll
          cp docs/index.html target/doc/index.html
          cp docs/layout.css target/doc/layout.css
          cp docs/navigation.js target/doc/navigation.js
          mkdir -p target/doc/analytics target/doc/assets
          cp docs/analytics/analytics.js target/doc/analytics/
          cp docs/assets/* target/doc/assets/
          python3 scripts/check-docs-analytics.py target/doc
          python3 scripts/check-docs-site.py target/doc
          python3 scripts/ci/validate-example-base-urls.py --rendered-docs target/doc
          node scripts/ci/test-docs-analytics.mjs
          node scripts/ci/test-docs-navigation.mjs

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: 1.86.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: scripts/ci/install-release-tooling.sh "${RUNNER_TEMP}/release-tooling"
      - name: Build and verify the publishable crate
        run: |
          cargo package
          archive="target/package/durable-workflow-$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])').crate"
          python3 scripts/ci/release_package.py --archive "$archive"
          python3 scripts/ci/verify-fresh-consumer.py package
      - name: Validate release tooling
        run: |
          bash -n scripts/ci/crates-io-publish-lib.sh scripts/ci/install-release-tooling.sh scripts/ci/publish-rust-sdk.sh scripts/ci/test-crates-io-publish.sh
          scripts/ci/test-crates-io-publish.sh
          python scripts/ci/test-publish-rust-sdk.py
          python scripts/ci/test-release-package.py
          python scripts/ci/test-example-base-urls.py

  cooperative-server:
    name: Cooperative Server source qualification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cooperative_qualification }}
    needs: [action-policy, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: rust-cooperative-${{ github.run_id }}-${{ github.run_attempt }}
      SERVER_CANDIDATE_SHA: ${{ inputs.server_commit }}
      NATIVE_CANDIDATE_SHA: ${{ inputs.native_commit }}
      DURABLE_WORKFLOW_SERVER_SOURCE: ${{ github.workspace }}/.cooperative-server-source
      DURABLE_WORKFLOW_NATIVE_SOURCE: ${{ github.workspace }}/.cooperative-native-source
      DURABLE_WORKFLOW_AUTH_TOKEN: test-token
      COMPOSE_FILE: docker-compose.cooperative.yml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Require an exact Server candidate
        run: '[[ "$SERVER_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out the public Server candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/server
          ref: ${{ inputs.server_commit }}
          path: .cooperative-server-source
          persist-credentials: false
      - name: Verify checked-out candidate identity
        run: test "$(git -C .cooperative-server-source rev-parse HEAD)" = "$SERVER_CANDIDATE_SHA"
      - name: Require an exact optional Native candidate
        if: ${{ inputs.native_commit != '' }}
        run: '[[ "$NATIVE_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out the public Native candidate
        if: ${{ inputs.native_commit != '' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/workflow
          ref: ${{ inputs.native_commit }}
          path: .cooperative-native-source
          persist-credentials: false
      - name: Verify Native identity and select its readonly source overlay
        if: ${{ inputs.native_commit != '' }}
        run: |
          test "$(git -C .cooperative-native-source rev-parse HEAD)" = "$NATIVE_CANDIDATE_SHA"
          printf 'COMPOSE_FILE=docker-compose.cooperative.yml:docker-compose.native-cancellation.yml\n' >> "$GITHUB_ENV"
          printf 'DURABLE_WORKFLOW_NATIVE_SOURCE_QUALIFICATION=1\n' >> "$GITHUB_ENV"
      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: 1.86.0
      - name: Start isolated Server stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Retain runtime identity and select endpoint
        run: |
          docker compose exec -T server cat /app/.package-provenance > cooperative-package-provenance.txt
          docker compose images --format json > cooperative-images.json
          jq --null-input --arg sdk "$GITHUB_SHA" --arg server "$SERVER_CANDIDATE_SHA" --arg native "$NATIVE_CANDIDATE_SHA" \
            '{qualification:"source",sdk_commit:$sdk,server_commit:$server,native_source_overlay:($native | if length > 0 then . else null end)}' \
            > cooperative-source-provenance.json
          endpoint="$(docker compose port server 8080)"
          echo "DURABLE_WORKFLOW_SERVER_URL=http://$endpoint" >> "$GITHUB_ENV"
      - name: Run actual Worker cooperative scenarios
        shell: bash
        run: |
          arguments=(--ignored --nocapture --test-threads=1)
          if [ -z "$NATIVE_CANDIDATE_SHA" ]; then
            arguments+=(--skip server_scope_opening_proves_real_native_tree_on_original_claim)
            arguments+=(--skip server_scope_authoring_replays_nested_tree_and_deferred_membership_on_replacement)
            arguments+=(--skip server_scope_cleanup_preserves_original_delivery_and_budget_after_replacement)
            arguments+=(--skip server_scope_group_cleanup_preserves_original_delivery_and_budget_after_replacement)
            arguments+=(--skip server_sigkill_scoped_cleanup_replays_before_root_with_original_30_second_deadline)
            arguments+=(--skip server_scope_try_stops_actual_remote_callback_without_application_heartbeats)
            arguments+=(--skip server_scope_wait_stops_actual_remote_callback_before_cleanup)
            arguments+=(--skip server_scope_group_wait_stops_actual_remote_callback_before_cleanup)
          fi
          cargo test --test cooperative_server -- "${arguments[@]}" 2>&1 | tee cooperative-results.log
      - name: Retain bounded scenario evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: cooperative-server-${{ github.sha }}
          path: |
            cooperative-results.log
            cooperative-package-provenance.txt
            cooperative-images.json
            cooperative-source-provenance.json
          retention-days: 90
          if-no-files-found: warn
      - name: Emit failure diagnostics
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail 100 bootstrap server worker repair
      - name: Remove task runtime resources
        if: ${{ always() }}
        run: |
          docker compose down -v
          docker image rm "dw-rust-cooperative-server:$SERVER_CANDIDATE_SHA"

  local-server:
    name: Local activity Server qualification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.local_qualification }}
    needs: [action-policy, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: rust-local-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: docker-compose.local-activities.yml
      DURABLE_WORKFLOW_AUTH_TOKEN: test-token
      DURABLE_WORKFLOW_LOCAL_ISOLATED: '1'
      LOCAL_SDK_VERSION: ${{ inputs.local_sdk_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: 1.86.0
      - name: Start the exact published runtime
        run: |
          docker compose up -d --wait --wait-timeout 300 server worker ack-proxy
          docker compose up -d repair
          docker compose exec -T server curl -fsS http://localhost:8080/api/ready
          docker compose exec -T server cat /app/.package-provenance > local-package-provenance.txt
          docker compose images --format json > local-images.json
          printf 'DURABLE_WORKFLOW_SERVER_URL=http://%s\n' "$(docker compose port server 8080)" >> "$GITHUB_ENV"
          printf 'DURABLE_WORKFLOW_LOCAL_ACK_PROXY_URL=http://%s\n' "$(docker compose port ack-proxy 3000)" >> "$GITHUB_ENV"
      - name: Prepare an exact published SDK consumer when requested
        if: ${{ inputs.local_sdk_version != '' }}
        run: |
          [[ "$LOCAL_SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          mkdir -p .local-consumer/tests .local-consumer/src
          printf '[package]\nname = "local-activity-consumer"\nversion = "0.0.0"\nedition = "2021"\n[dependencies]\ndurable-workflow = "=%s"\nreqwest = { version = "0.12", features = ["json"] }\nserde_json = "1"\ntokio = { version = "1", features = ["full"] }\n' "$LOCAL_SDK_VERSION" > .local-consumer/Cargo.toml
          printf 'fn main() {}\n' > .local-consumer/src/main.rs
          cp tests/local_activity_server.rs .local-consumer/tests/
          cargo metadata --manifest-path .local-consumer/Cargo.toml --format-version 1 > local-consumer-metadata.json
          jq --arg version "$LOCAL_SDK_VERSION" -e '[.packages[] | select(.name == "durable-workflow" and .version == $version and (.source | startswith("registry+https://github.com/rust-lang/crates.io-index")))] | length == 1' local-consumer-metadata.json
      - name: Run actual Worker local activity scenarios
        run: |
          arguments=()
          if [ -n "$LOCAL_SDK_VERSION" ]; then arguments+=(--manifest-path .local-consumer/Cargo.toml); fi
          cargo test "${arguments[@]}" --test local_activity_server -- --ignored --nocapture --test-threads=1 2>&1 | tee local-results.log
          jq --null-input --arg sdk "$GITHUB_SHA" --arg version "$LOCAL_SDK_VERSION" \
            '{runner_commit:$sdk,sdk_commit:(if $version == "" then $sdk else null end),published_sdk_version:($version | if length > 0 then . else null end),server_version:"2.5.0",native_version:"2.4.0"}' > local-qualification.json
          if [ -n "$LOCAL_SDK_VERSION" ]; then
            find "$HOME/.cargo/registry/cache" -name "durable-workflow-$LOCAL_SDK_VERSION.crate" -exec sha256sum '{}' \; > local-crate-sha256.txt
            test -s local-crate-sha256.txt
          fi
      - name: Retain bounded scenario evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: local-activities-${{ github.sha }}
          path: |
            local-results.log
            local-package-provenance.txt
            local-images.json
            local-qualification.json
            local-crate-sha256.txt
            local-consumer-metadata.json
          retention-days: 90
          if-no-files-found: warn
      - name: Emit failure diagnostics
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail 100 bootstrap server worker repair ack-proxy
      - name: Remove task runtime resources
        if: ${{ always() }}
        run: docker compose down -v

  target-branch-qualification:
    name: Target branch qualification
    if: ${{ always() }}
    needs: [action-policy, regression-corpus, test, protocol, docs, package, cooperative-server, local-server]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require central action policy preflight
        if: ${{ github.server_url == 'https://github.com' }}
        env:
          ACTION_POLICY_RESULT: ${{ needs.action-policy.result }}
        run: test "$ACTION_POLICY_RESULT" = success
      - name: Require the supported Rust and package checks
        env:
          CORPUS_RESULT: ${{ needs.regression-corpus.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COOPERATIVE_REQUESTED: ${{ inputs.cooperative_qualification }}
          COOPERATIVE_RESULT: ${{ needs.cooperative-server.result }}
          LOCAL_REQUESTED: ${{ inputs.local_qualification }}
          LOCAL_RESULT: ${{ needs.local-server.result }}
        run: |
          test "$CORPUS_RESULT" = success
          test "$DOCS_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$PROTOCOL_RESULT" = success
          test "$TEST_RESULT" = success
          if [ "$COOPERATIVE_REQUESTED" = true ]; then
            test "$COOPERATIVE_RESULT" = success
          fi
          if [ "$LOCAL_REQUESTED" = true ]; then
            test "$LOCAL_RESULT" = success
          fi
