name: API Documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'Cargo.toml'
      - 'scripts/check-docs-analytics.py'
      - 'scripts/check-docs-site.py'
      - 'scripts/ci/test-docs-analytics.mjs'
      - 'scripts/ci/test-docs-navigation.mjs'
      - 'scripts/ci/*docs-release.py'
      - 'release/approved-packages/*.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/ci/*docs-release.py'
      - 'scripts/check-docs-*.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-api-documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the published stable documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Set up Python for dependency trust
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - name: Bootstrap verified dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
        with:
          clients: pip,python,cargo,curl,git
      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@4d407b29186a635f0cc27475ef0bc0ae605a8866  # 1.86.0
      - name: Verify public stable package and source identity
        run: |
          python3 scripts/ci/test-resolve-docs-release.py
          python3 scripts/ci/resolve-docs-release.py \
            --destination "$RUNNER_TEMP/stable-source" \
            --identity "$RUNNER_TEMP/docs-release.json"
      - name: Build and check the documentation
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          CARGO_BUILD_JOBS: '2'
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            if ! printf '%s' "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" | grep -Eq '^[a-f0-9]{32}$'; then
              echo 'CLOUDFLARE_WEB_ANALYTICS_TOKEN must be a 32-character site token' >&2
              exit 1
            fi
            sed -i "s/__CLOUDFLARE_WEB_ANALYTICS_TOKEN__/$CLOUDFLARE_WEB_ANALYTICS_TOKEN/" \
              docs/analytics/analytics.js
          fi
          export RUSTDOCFLAGS="-D warnings --html-in-header $GITHUB_WORKSPACE/docs/analytics-head.html"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/stable-docs-target"
          cargo doc --manifest-path "$RUNNER_TEMP/stable-source/Cargo.toml" --locked --all-features --no-deps
          cargo doc --manifest-path "$RUNNER_TEMP/stable-source/Cargo.toml" --locked --all-features --no-deps --examples
          mkdir -p target
          mv "$CARGO_TARGET_DIR/doc" target/doc
          printf '%s\n' 'rust.durable-workflow.com' > target/doc/CNAME
          touch target/doc/.nojekyll
          cp docs/index.html target/doc/index.html
          cp docs/layout.css target/doc/layout.css
          cp docs/navigation.js target/doc/navigation.js
          mkdir -p target/doc/analytics target/doc/assets
          cp docs/analytics/analytics.js target/doc/analytics/
          cp docs/assets/* target/doc/assets/
          cp "$RUNNER_TEMP/docs-release.json" target/doc/__build.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re
          identity = json.loads(Path('target/doc/__build.json').read_text())
          landing = Path('target/doc/index.html')
          html = landing.read_text().replace('Stable release</strong>', f"Stable release {identity['version']}</strong>")
          html = re.sub(r'(https://github.com/durable-workflow/sdk-rust/blob/)[^/]+(/examples/)', rf"\g<1>{identity['source_revision']}\2", html)
          landing.write_text(html)
          PY
          python3 scripts/check-docs-analytics.py target/doc
          python3 scripts/check-docs-site.py target/doc
          python3 scripts/ci/validate-example-base-urls.py --root "$RUNNER_TEMP/stable-source" --rendered-docs target/doc
          node scripts/ci/test-docs-analytics.mjs
          node scripts/ci/test-docs-navigation.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        if: github.ref == 'refs/heads/main'
        with:
          path: target/doc

  deploy:
    name: Deploy the Rust documentation
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: https://rust.durable-workflow.com/
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
