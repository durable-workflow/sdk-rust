name: API Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-documentation
  cancel-in-progress: false

jobs:
  build:
    name: Build rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Configure GitHub Pages
        if: >-
          github.api_url == 'https://api.github.com' &&
          github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@4d407b29186a635f0cc27475ef0bc0ae605a8866  # 1.86.0

      - name: Build complete API documentation
        env:
          RUSTDOCFLAGS: -D warnings --html-in-header docs/analytics-head.html
        run: cargo doc --all-features --no-deps

      - name: Prepare Pages artifact
        run: |
          printf '%s\n' 'rust.durable-workflow.com' > target/doc/CNAME
          touch target/doc/.nojekyll
          cp docs/index.html target/doc/index.html
          mkdir -p target/doc/analytics
          cp docs/analytics/analytics.css docs/analytics/analytics.js target/doc/analytics/
          python3 scripts/check-docs-analytics.py target/doc

      - name: Upload Pages artifact
        if: >-
          github.api_url == 'https://api.github.com' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: target/doc

  deploy:
    name: Deploy rustdoc
    needs: build
    if: >-
      github.api_url == 'https://api.github.com' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
