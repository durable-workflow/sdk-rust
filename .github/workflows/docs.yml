name: API Documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'Cargo.toml'
      - 'scripts/check-docs-analytics.py'
      - 'scripts/check-docs-site.py'
      - 'scripts/ci/test-docs-analytics.mjs'
      - 'scripts/ci/test-docs-navigation.mjs'
      - 'scripts/ci/validate-example-base-urls.py'
      - 'scripts/ci/*docs-release.py'
      - 'scripts/ci/build-stable-docs.sh'
      - 'scripts/ci/release_package.py'
      - 'scripts/ci/install-release-tooling.sh'
      - 'scripts/ci/release-tooling-requirements.txt'
      - 'release/approved-packages/*.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-api-documentation
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the published stable documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Set up Python for dependency trust
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - name: Bootstrap verified dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
        with:
          clients: pip,python,cargo,curl,git
      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@4d407b29186a635f0cc27475ef0bc0ae605a8866  # 1.86.0
      - name: Install isolated approval verification tooling
        run: scripts/ci/install-release-tooling.sh "${RUNNER_TEMP}/release-tooling"
      - name: Build and check the published documentation
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: bash scripts/ci/build-stable-docs.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        if: github.ref == 'refs/heads/main'
        with:
          path: target/stable-docs

  deploy:
    name: Deploy the Rust documentation
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: https://rust.durable-workflow.com/
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
