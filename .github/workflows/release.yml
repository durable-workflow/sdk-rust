name: Release

run-name: Release ${{ inputs.release_tag }} at ${{ inputs.release_commit }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable SDK release tag to publish or verify
        required: true
        type: string
      release_commit:
        description: Exact source commit for publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact crates.io package
    if: >-
      github.repository == 'durable-workflow/sdk-rust' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: crates-io
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: release-source
    steps:
      - name: Check out maintained release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false

      - name: Check out immutable package source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', inputs.release_tag) }}
          path: release-source
          persist-credentials: false

      - name: Resolve exact release identity
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          REQUESTED_RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            printf 'release tag must be an exact SDK SemVer: %s\n' "$REQUESTED_RELEASE_TAG" >&2
            exit 1
          fi
          if [[ ! "$REQUESTED_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'release commit must be a full lowercase Git commit: %s\n' \
              "$REQUESTED_RELEASE_COMMIT" >&2
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "$REQUESTED_RELEASE_TAG")"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            printf 'release tag %s resolves to %s, not checked-out commit %s\n' \
              "$REQUESTED_RELEASE_TAG" "$tag_commit" "$head_commit" >&2
            exit 1
          fi
          if [[ "$tag_commit" != "$REQUESTED_RELEASE_COMMIT" ]]; then
            printf 'release tag %s resolves to %s, not requested commit %s at checkout %s\n' \
              "$REQUESTED_RELEASE_TAG" "$tag_commit" "$REQUESTED_RELEASE_COMMIT" "$head_commit" >&2
            exit 1
          fi
          {
            printf 'RELEASE_TAG=%s\n' "$REQUESTED_RELEASE_TAG"
            printf 'RELEASE_COMMIT=%s\n' "$head_commit"
          } >> "$GITHUB_ENV"

      - name: Set up Python for release tooling
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: Bootstrap patched pip trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
        with:
          clients: pip,python,cargo,curl,git

      - name: Install hash-locked release tooling
        run: ../release-tools/scripts/ci/install-release-tooling.sh "${RUNNER_TEMP}/release-tooling"

      - name: Prepare exact source release notes
        run: |
          python3 ../release-tools/scripts/ci/release_package.py \
            --release-notes "$RELEASE_TAG" > "${RUNNER_TEMP}/rust-sdk-release-notes.md"

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@4d407b29186a635f0cc27475ef0bc0ae605a8866  # 1.86.0

      - name: Obtain a short-lived crates.io publication token
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        env:
          NODE_OPTIONS: --use-openssl-ca
          NODE_EXTRA_CA_CERTS: ''
          NODE_USE_SYSTEM_CA: '0'
          NODE_TLS_REJECT_UNAUTHORIZED: '1'

      - name: Publish and verify exact crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: ../release-tools/scripts/ci/publish-rust-sdk.sh

      - name: Create the source GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            arguments=(--verify-tag --notes-file "${RUNNER_TEMP}/rust-sdk-release-notes.md" --title "$RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* ]]; then
              arguments+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${arguments[@]}"
          fi

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: rust-sdk-release-evidence-${{ env.RELEASE_TAG }}
          path: release-source/rust-sdk-release-evidence.json
          if-no-files-found: error
