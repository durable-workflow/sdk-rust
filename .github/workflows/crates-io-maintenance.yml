name: Crates.io Registry Maintenance

run-name: Audit crates.io and retire unsupported pre-2.0 final releases

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-registry-maintenance
  cancel-in-progress: false

jobs:
  retire:
    name: Retire reviewed historical releases
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'durable-workflow/sdk-rust' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: crates-io
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@4d407b29186a635f0cc27475ef0bc0ae605a8866  # 1.86.0

      - name: Yank only the reviewed historical versions
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: >-
          python3 scripts/ci/maintain-crates-io.py retire
          --evidence crates-io-retirement-evidence.json

      - name: Upload retirement evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: crates-io-retirement-evidence-${{ github.run_id }}
          path: crates-io-retirement-evidence.json
          if-no-files-found: error
          retention-days: 90

  audit:
    name: Audit public registry discovery
    needs: [retire]
    if: >-
      always() &&
      github.repository == 'durable-workflow/sdk-rust' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Install Rust 1.86
        uses: dtolnay/rust-toolchain@4d407b29186a635f0cc27475ef0bc0ae605a8866  # 1.86.0

      - name: Audit discovery and exact prerelease installation
        run: >-
          python3 scripts/ci/maintain-crates-io.py audit
          --evidence crates-io-audit-evidence.json

      - name: Upload live audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: crates-io-audit-evidence-${{ github.run_id }}
          path: crates-io-audit-evidence.json
          if-no-files-found: error
          retention-days: 90
